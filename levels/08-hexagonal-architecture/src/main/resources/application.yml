payment:
  enabled: [stripe, paypal, adyen, providerx, holdonly, chargeonly, asyncpay]     # gateways to build

  base-urls:
    stripe: http://localhost:4101
    paypal: http://localhost:4102
    adyen: http://localhost:4103
    providerx: http://localhost:4104
    holdonly: http://localhost:4105
    chargeonly: http://localhost:4106
    asyncpay: http://localhost:4107

  # Which currencies and operations a provider supports is NOT here: each provider declares it.
  # Precedence: merchant → currency → default → fallback-order.
  routing:
    default-provider: stripe
    by-currency:
      EUR: adyen
      USD: stripe
      GBP: paypal
    by-merchant:
      acme: stripe
      initech: providerx
      hooli: holdonly
      pied-piper: chargeonly
      vandelay: asyncpay
    fallback-order: [adyen, stripe]

  resilience:
    connect-timeout: 1s
    read-timeout: 3s
    max-attempts: 3
    retry-base-delay: 100ms
    breaker-failure-threshold: 5
    breaker-open-for: 30s

  reconciliation:
    enabled: true
    interval: PT30S                    # ISO-8601: @Scheduled does not understand "30s"

  # merchant → provider → credentials. Demo values; a real deployment reads a secret store.
  # A merchant only uses providers it has credentials for.
  merchants:
    acme:
      stripe: { api-key: sk_test_acme }
      adyen: { api-key: test_acme, merchant-account: AcmeECOM }
      paypal: { client-id: acme-client, client-secret: sim-secret-acme }
    globex:
      stripe: { api-key: sk_test_globex }
      adyen: { api-key: test_globex, merchant-account: GlobexECOM }
      paypal: { client-id: globex-client, client-secret: sim-secret-globex }

    initech:
      providerx: { token: xt_initech }
    hooli:
      holdonly: { key: syn_hooli }
      stripe: { api-key: sk_test_hooli }
    pied-piper:
      chargeonly: { key: syn_piper }
    vandelay:
      asyncpay: { key: syn_vandelay }

  # Webhook secrets are per provider account here; per-merchant secrets are a small extension.
  stripe:
    webhook-secret: whsec_sim
  paypal:
    webhook-secret: paypal_whsec_sim
  adyen:
    hmac-key: adyen_hmac_sim

# A FILE database: payments survive a restart.
spring:
  datasource:
    url: jdbc:h2:file:./target/level08-db;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-} aid=%X{attemptId:-}]"
